<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial clínico | VetCare Manager</title>
<link rel="stylesheet" href="css/site.css">
</head><body><main class="shell">
<header class="top site-header"><a class="brand" href="index.html"><span class="mark">✚</span><span>VetCare Manager</span></a><nav class="tabs site-nav" aria-label="Secciones">
<a class="tab" href="index.html">Propietarios y mascotas</a><a class="tab" href="consultas.html">Consultas médicas</a><a class="tab active" href="historial.html" aria-current="page">Historial clínico</a><a class="tab" href="reportes.html">Reportes</a>
</nav></header>
<section class="page-intro"><div class="eyebrow">Ficha del paciente</div><h1>Historial clínico</h1><p>Consulta las visitas, diagnósticos y tratamientos de cada mascota.</p></section>
<section class="panel">
  <div class="filter-bar"><div class="field"><label for="pet">Mascota</label><select id="pet"><option value="">Cargando mascotas...</option></select></div><button class="button" id="search" type="button">Consultar historial</button></div>
  <div id="msg" class="notice" role="status" aria-live="polite"></div><div id="list" class="record-list"></div>
</section>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const select=document.getElementById("pet"),msg=document.getElementById("msg");try{const response=await fetch("/api/mascotas");if(!response.ok)throw Error("HTTP "+response.status);const pets=await response.json();select.innerHTML='<option value="">Selecciona una mascota</option>'+pets.map(p=>`<option value="${p.id}">${esc(p.nombre)} · ${esc(p.especie)}</option>`).join("");}catch(error){select.innerHTML='<option value="">No se pudieron cargar</option>';msg.textContent="No se pudieron cargar las mascotas: "+error.message;msg.className="notice error";}}
async function load(){const id=document.getElementById("pet").value,msg=document.getElementById("msg"),list=document.getElementById("list");if(!id){msg.textContent="Selecciona una mascota para continuar.";msg.className="notice error";list.innerHTML="";return;}msg.textContent="Cargando historial...";msg.className="notice";try{const response=await fetch(`/api/mascotas/${id}/historial`);if(!response.ok)throw Error("HTTP "+response.status);const rows=await response.json();msg.textContent=rows.length+" "+(rows.length===1?"atención encontrada.":"atenciones encontradas.");list.innerHTML=rows.length?rows.map(c=>`<article class="record-card"><div class="record-header"><div><span class="record-label">${esc(c.veterinarioNombre)}</span><h3>${new Date(c.fechaConsulta).toLocaleDateString("es-PE",{dateStyle:"long"})}</h3></div><time class="record-date">${new Date(c.fechaConsulta).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"})}</time></div><dl class="record-details"><div><dt>Motivo</dt><dd>${esc(c.motivo)}</dd></div><div><dt>Diagnóstico</dt><dd>${esc(c.diagnostico)}</dd></div>${c.tratamiento?`<div><dt>Tratamiento</dt><dd>${esc(c.tratamiento)}</dd></div>`:""}${c.vacunasAplicadas?`<div><dt>Vacunas</dt><dd>${esc(c.vacunasAplicadas)}</dd></div>`:""}</dl></article>`).join(""):'<div class="empty">Esta mascota no tiene consultas registradas.</div>';}catch(error){msg.textContent="No se pudo consultar el historial: "+error.message;msg.className="notice error";}}
document.getElementById("search").onclick=load;init();
</script></main></body></html>
