<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetCare Manager</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#182522;background:#f5f7f4}
*{box-sizing:border-box}body{margin:0}.shell{max-width:1000px;margin:auto;padding:32px 22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
a{color:#176b55}.brand{font-weight:750;color:#182522;text-decoration:none}.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a,.btn{padding:9px 12px;border-radius:9px;background:#176b55;color:#fff;text-decoration:none;border:0;cursor:pointer;font:inherit}
.panel{background:#fff;border:1px solid #e5ebe7;border-radius:14px;padding:20px;margin:14px 0}
h1{margin:8px 0}p,.muted{color:#65736f}input,select{padding:10px;border:1px solid #d9e1dc;border-radius:8px;font:inherit}
label{display:block;font-size:13px;margin:10px 0 5px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.card{padding:13px;border:1px solid #e5ebe7;border-radius:10px;margin:9px 0;line-height:1.55}
.notice{font-size:13px;color:#176b55}.error{color:#b33f32}.empty{padding:22px;text-align:center;color:#65736f}
</style></head><body><main class="shell">
<header><a class="brand" href="index.html">✚ VetCare Manager</a><nav class="nav">
<a href="index.html">Inicio</a><a href="consultas.html">Consultas</a><a href="historial.html">Historial</a><a href="reportes.html">Reportes</a>
</nav></header>
<h1>Historial clínico por mascota</h1><p>Selecciona una mascota para consultar sus atenciones.</p>
<section class="panel"><div class="row"><div><label for="pet">Mascota</label><select id="pet"><option value="">Cargando mascotas...</option></select></div><button class="btn" id="search">Consultar historial</button></div><div id="msg" class="notice"></div><div id="list"></div></section>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const s=document.getElementById("pet");try{const r=await fetch("/api/mascotas");if(!r.ok)throw Error("HTTP "+r.status);const pets=await r.json();s.innerHTML='<option value="">Selecciona una mascota</option>'+pets.map(p=>`<option value="${p.id}">${esc(p.nombre)} · ${esc(p.especie)}</option>`).join("");}catch(e){s.innerHTML='<option value="">No se pudieron cargar</option>';document.getElementById("msg").textContent=e.message;}}
async function load(){const id=document.getElementById("pet").value,msg=document.getElementById("msg"),list=document.getElementById("list");if(!id){msg.textContent="Selecciona una mascota.";return;}try{const r=await fetch(`/api/mascotas/${id}/historial`);if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json();msg.textContent=data.length+" atención(es) encontrada(s).";list.innerHTML=data.length?data.map(c=>`<article class="card"><strong>${new Date(c.fechaConsulta).toLocaleString("es-PE")} · ${esc(c.veterinarioNombre)}</strong><br>Motivo: ${esc(c.motivo)}<br>Diagnóstico: ${esc(c.diagnostico)}${c.tratamiento?`<br>Tratamiento: ${esc(c.tratamiento)}`:""}${c.vacunasAplicadas?`<br>Vacunas: ${esc(c.vacunasAplicadas)}`:""}</article>`).join(""):'<div class="empty">Esta mascota no tiene consultas registradas.</div>';}catch(e){msg.textContent="No se pudo consultar: "+e.message;}}
document.getElementById("search").onclick=load;init();
</script></main></body></html>
