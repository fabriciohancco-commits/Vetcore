<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes | VetCare Manager</title>
<link rel="stylesheet" href="css/site.css">
</head><body><main class="shell">
<header class="top site-header"><a class="brand" href="index.html"><span class="mark">✚</span><span>VetCare Manager</span></a><nav class="tabs site-nav" aria-label="Secciones">
<a class="tab" href="index.html">Propietarios y mascotas</a><a class="tab" href="consultas.html">Consultas médicas</a><a class="tab" href="historial.html">Historial clínico</a><a class="tab active" href="reportes.html" aria-current="page">Reportes</a>
</nav></header>
<section class="page-intro"><div class="eyebrow">Resumen de actividad</div><h1>Reportes de atenciones</h1><p>Explora la actividad clínica por fechas y veterinario.</p></section>
<section class="panel">
  <div class="section-heading"><div><h2>Filtrar atenciones</h2><p>Elige un rango de fechas y, si deseas, un veterinario.</p></div></div>
  <form id="report-filter-form" class="filter-bar report-filters">
    <div class="field"><label for="desde">Desde</label><input id="desde" type="date"></div>
    <div class="field"><label for="hasta">Hasta</label><input id="hasta" type="date"></div>
    <div class="field"><label for="vet">Veterinario</label><input id="vet" placeholder="Todos los veterinarios"></div>
    <button class="button" id="run" type="submit">Generar reporte</button>
    <button class="button secondary" type="reset">Limpiar filtros</button>
  </form>
  <div id="msg" class="notice" role="status" aria-live="polite"></div><div id="summary" class="report-summary" aria-live="polite"></div><div id="list" class="record-list"></div>
</section>
<script type="module" src="js/reportes.js"></script></main></body></html>
